<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>소수 곱셈 연습실</title>
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#28323c;--muted:#6b7680;--mint:#dff7ec;--mint2:#6fd3a9;--sky:#dff1ff;--blue:#67aee8;--yellow:#fff1a8;--pink:#ffe1ec;--red:#e45b67;--line:#dde6ec;--shadow:0 14px 40px rgba(39,64,84,.10)}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0%,#fff3c9 0 12%,transparent 13%),radial-gradient(circle at 95% 8%,#dff1ff 0 11%,transparent 12%),var(--bg)}button,input{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:22px}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:25px}.mascot{width:48px;height:48px;border-radius:16px;background:var(--yellow);display:grid;place-items:center;font-size:27px;box-shadow:var(--shadow)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#eef3f6;color:var(--ink)}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--mint2);color:#103d31}.btn.blue{background:var(--blue);color:#fff}.btn.warn{background:var(--yellow)}.btn.danger{background:#ffe0e3;color:#8b2630}.panel{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}h1{font-size:34px;letter-spacing:-1px;margin-bottom:8px}.lead{font-size:17px;color:var(--muted);line-height:1.65}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.choicebox{border:2px solid var(--line);border-radius:18px;padding:16px;background:#fff}.choicebox h3{font-size:16px;margin-bottom:10px}.seg{display:flex;flex-wrap:wrap;gap:8px}.seg input{display:none}.seg label{padding:10px 13px;border-radius:12px;background:#f2f5f7;border:2px solid transparent;font-weight:750;cursor:pointer}.seg input:checked+label{background:var(--sky);border-color:var(--blue);color:#155488}.startbox{display:flex;justify-content:center;margin-top:22px}.start{padding:15px 34px;border-radius:18px;font-size:20px}.hidden{display:none!important}.status{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;margin-bottom:18px}.progress-wrap{height:14px;background:#edf2f4;border-radius:99px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--mint2),var(--blue));transition:.3s}.chip{background:#f4f7f9;border-radius:99px;padding:9px 12px;font-weight:800;white-space:nowrap}.question-card{text-align:center;padding:32px 20px 24px}.qtype{display:inline-block;background:var(--pink);padding:7px 12px;border-radius:99px;font-weight:900;color:#843f5c;margin-bottom:14px}.equation{font-size:54px;font-weight:950;letter-spacing:1px;margin:10px 0 24px}.answer-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.answer-input{width:230px;padding:15px 18px;border:3px solid #cbd8e0;border-radius:16px;text-align:center;font-size:27px;font-weight:900;outline:none}.answer-input:focus{border-color:var(--blue)}.mcq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:620px;margin:0 auto}.mcq button{padding:17px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:22px;font-weight:900}.mcq button:hover{background:var(--sky);border-color:var(--blue)}.feedback{margin:22px auto 0;max-width:720px;border-radius:18px;padding:18px;text-align:left}.feedback.good{background:var(--mint);border:2px solid #aee6cd}.feedback.bad{background:#fff0f2;border:2px solid #f3b9c1}.feedback-title{font-size:20px;font-weight:950;margin-bottom:7px}.solution{margin-top:10px;line-height:1.75;color:#4b5965;background:#fff;border-radius:14px;padding:14px;border:1px dashed #cfd9df}.navrow{display:flex;justify-content:center;gap:10px;margin-top:18px}.result-hero{text-align:center}.scorebig{font-size:62px;font-weight:950;color:#28755a;margin:8px 0}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{padding:18px;border-radius:18px;background:#f6f9fa;text-align:center}.stat b{display:block;font-size:28px;margin-top:5px}.wrong-list{display:grid;gap:10px;margin-top:18px}.wrong-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 15px;background:#fff6f7;border:1px solid #f2c9ce;border-radius:14px}footer{font-size:13px;color:#8b949c;text-align:center;margin-top:16px}body.board .app{max-width:1400px}body.board .panel{padding:38px}body.board .equation{font-size:84px}body.board .answer-input{font-size:38px;width:310px}body.board .mcq button{font-size:32px;padding:24px}body.board .btn{font-size:20px;padding:16px 20px}body.board .lead{font-size:22px}body.board .qtype{font-size:18px}@media(max-width:720px){.app{padding:13px}.grid{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}.progress-wrap{grid-column:1/-1}.equation{font-size:42px}.mcq{grid-template-columns:1fr}.result-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.brand{font-size:20px}}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><div class="brand"><div class="mascot">🧮</div><span>소수 곱셈 연습실</span></div><div class="toolbar"><button class="btn" id="boardBtn">🖥️ 전자칠판 모드</button><button class="btn" id="homeBtn">🏠 처음으로</button></div></div>
<section id="setup" class="panel">
<h1>오늘의 소수 곱셈을 골라볼까요? ✨</h1><p class="lead">5학년 수준의 소수 곱셈을 단계별로 연습해요. 문제는 매번 새롭게 만들어집니다.</p>
<div class="grid">
<div class="choicebox"><h3>① 연습 범위</h3><div class="seg"><input type="radio" name="range" id="r1" value="dn" checked><label for="r1">소수 × 자연수</label><input type="radio" name="range" id="r2" value="nd"><label for="r2">자연수 × 소수</label><input type="radio" name="range" id="r3" value="dd"><label for="r3">소수 × 소수</label><input type="radio" name="range" id="r4" value="mix"><label for="r4">섞어서 도전</label></div></div>
<div class="choicebox"><h3>② 난이도</h3><div class="seg"><input type="radio" name="level" id="l1" value="basic" checked><label for="l1">🌱 기본</label><input type="radio" name="level" id="l2" value="challenge"><label for="l2">🚀 도전</label></div></div>
<div class="choicebox"><h3>③ 문제 수</h3><div class="seg"><input type="radio" name="count" id="c10" value="10" checked><label for="c10">10문제</label><input type="radio" name="count" id="c20" value="20"><label for="c20">20문제</label><input type="radio" name="count" id="c30" value="30"><label for="c30">30문제</label><input type="radio" name="count" id="c40" value="40"><label for="c40">40문제</label></div></div>
<div class="choicebox"><h3>④ 답하는 방법</h3><div class="seg"><input type="radio" name="mode" id="m1" value="input" checked><label for="m1">⌨️ 직접 입력</label><input type="radio" name="mode" id="m2" value="mcq"><label for="m2">🔘 객관식</label><input type="radio" name="mode" id="m3" value="mix"><label for="m3">🎲 섞어서</label></div></div>
</div><div class="startbox"><button id="startBtn" class="btn primary start">연습 시작하기 🚀</button></div>
</section>
<section id="quiz" class="panel hidden"><div class="status"><div class="progress-wrap"><div id="progress" class="progress"></div></div><div class="chip" id="qnum">1 / 10</div><div class="chip">⭐ 점수 <span id="score">0</span></div><div class="chip">🔥 연속 <span id="streak">0</span></div></div><div class="question-card"><div id="qtype" class="qtype">소수 × 자연수</div><div id="equation" class="equation">2.4 × 3 = ?</div><div id="inputMode" class="answer-row"><input id="answerInput" class="answer-input" inputmode="decimal" autocomplete="off" placeholder="답 입력"><button id="checkBtn" class="btn blue">정답 확인</button></div><div id="mcqMode" class="mcq hidden"></div><div id="feedback" class="feedback hidden"><div id="feedbackTitle" class="feedback-title"></div><div id="feedbackText"></div><div id="solution" class="solution hidden"></div></div><div class="navrow"><button id="solutionBtn" class="btn warn hidden">💡 풀이 보기</button><button id="nextBtn" class="btn primary hidden">다음 문제 →</button></div></div></section>
<section id="result" class="panel hidden"><div class="result-hero"><h1>연습 완료! 🎉</h1><p class="lead">끝까지 풀어낸 것만으로도 아주 훌륭해요.</p><div id="scoreBig" class="scorebig">80점</div></div><div class="result-grid"><div class="stat">맞힌 문제<b id="correctStat">0</b></div><div class="stat">최고 연속 정답<b id="bestStreakStat">0</b></div><div class="stat">정확도<b id="accuracyStat">0%</b></div></div><div id="wrongSection"><h2>다시 보면 좋은 문제</h2><div id="wrongList" class="wrong-list"></div></div><div class="navrow"><button id="retryWrongBtn" class="btn danger">틀린 문제만 다시 풀기</button><button id="restartBtn" class="btn primary">새 연습 시작</button></div></section>
<footer>소수점은 점(.)으로 입력해도 됩니다. 예: 3.6</footer>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const state={questions:[],index:0,score:0,streak:0,bestStreak:0,wrong:[],retrying:false};
function radioValue(name){return document.querySelector(`input[name="${name}"]:checked`).value}function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function choice(arr){return arr[rand(0,arr.length-1)]}function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function pow10(n){return 10**n}function placesFromInt(intVal,places){return(intVal/pow10(places)).toFixed(places).replace(/\.?0+$/,'')}function normalizeNumberText(v){v=String(v).trim().replace(',','.');if(v===''||isNaN(Number(v)))return null;return Number(v)}
function makeDecimal(places,maxWhole,minInt=1){const scale=pow10(places),maxInt=maxWhole*scale+(scale-1);let n=rand(minInt,maxInt);if(n%scale===0)n+=rand(1,scale-1);return{int:n,places,text:placesFromInt(n,places)}}function makeNatural(maxN,minN=2){return{int:rand(minN,maxN),places:0,text:''}}
function buildQuestion(type,level){let a,b;if(type==='dn'){if(level==='basic'){a=makeDecimal(choice([1,1,1,2]),9);b=makeNatural(9,2)}else{a=makeDecimal(choice([1,2,2]),29);b=makeNatural(19,3)}b.text=String(b.int)}else if(type==='nd'){if(level==='basic'){a=makeNatural(9,2);a.text=String(a.int);b=makeDecimal(choice([1,1,2]),9)}else{a=makeNatural(19,3);a.text=String(a.int);b=makeDecimal(choice([1,2,2]),29)}}else{if(level==='basic'){a=makeDecimal(1,9);b=makeDecimal(choice([1,1,2]),9)}else{a=makeDecimal(choice([1,2]),19);b=makeDecimal(choice([1,2]),19)}}const productInt=a.int*b.int,totalPlaces=a.places+b.places,answer=productInt/pow10(totalPlaces),answerText=placesFromInt(productInt,totalPlaces);return{type,label:type==='dn'?'소수 × 자연수':type==='nd'?'자연수 × 소수':'소수 × 소수',a:a.text,b:b.text,answer,answerText,aInt:a.int,bInt:b.int,totalPlaces,level,mode:null}}
function generateQuestions(range,level,count,mode){const types=range==='mix'?['dn','nd','dd']:[range],qs=[],seen=new Set();while(qs.length<count){const q=buildQuestion(choice(types),level),key=`${q.a}x${q.b}`;if(seen.has(key))continue;seen.add(key);q.mode=mode==='mix'?(Math.random()<.5?'input':'mcq'):mode;qs.push(q)}return qs}
function distractors(q){const ans=q.answer,decs=q.totalPlaces,candidates=new Set();candidates.add(ans*10);candidates.add(ans/10);if(decs>=2)candidates.add(ans*100);candidates.add(ans+1/pow10(Math.max(0,decs-1)));candidates.add(Math.max(0,ans-1/pow10(Math.max(0,decs-1))));candidates.add(ans+1);candidates.add(Math.max(0,ans-1));return shuffle([...candidates].filter(x=>x!==ans&&x>=0&&Number.isFinite(x)).map(x=>Number(x.toFixed(4)))).slice(0,3)}function formatNum(x){if(Number.isInteger(x))return String(x);return String(Number(x.toFixed(4)))}function showScreen(id){['setup','quiz','result'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
function start(customQuestions=null){const questions=customQuestions||generateQuestions(radioValue('range'),radioValue('level'),Number(radioValue('count')),radioValue('mode'));state.questions=questions;state.index=0;state.score=0;state.streak=0;state.bestStreak=0;state.wrong=[];state.retrying=!!customQuestions;showScreen('quiz');renderQuestion()}
function renderQuestion(){const q=state.questions[state.index];$('#qnum').textContent=`${state.index+1} / ${state.questions.length}`;$('#score').textContent=state.score;$('#streak').textContent=state.streak;$('#progress').style.width=`${state.index/state.questions.length*100}%`;$('#qtype').textContent=q.label+(q.level==='challenge'?' · 도전':' · 기본');$('#equation').textContent=`${q.a} × ${q.b} = ?`;$('#feedback').className='feedback hidden';$('#solution').classList.add('hidden');$('#solutionBtn').classList.add('hidden');$('#nextBtn').classList.add('hidden');$('#inputMode').classList.toggle('hidden',q.mode!=='input');$('#mcqMode').classList.toggle('hidden',q.mode!=='mcq');$('#answerInput').value='';$('#answerInput').disabled=false;$('#checkBtn').disabled=false;if(q.mode==='mcq'){const opts=shuffle([q.answer,...distractors(q)]);$('#mcqMode').innerHTML='';opts.forEach(v=>{const b=document.createElement('button');b.textContent=formatNum(v);b.onclick=()=>grade(v,b);$('#mcqMode').appendChild(b)})}else setTimeout(()=>$('#answerInput').focus(),80)}
function makeSolution(q){const aDigits=q.a.replace('.',''),bDigits=q.b.replace('.',''),raw=Number(aDigits)*Number(bDigits),pa=(q.a.split('.')[1]||'').length,pb=(q.b.split('.')[1]||'').length,total=pa+pb;let steps=`<b>1.</b> 먼저 소수점을 잠시 생각하지 않고 자연수처럼 계산해요.<br>&nbsp;&nbsp;&nbsp;${aDigits} × ${bDigits} = <b>${raw}</b><br>`;if(total===0)steps+=`<b>2.</b> 소수 자릿수가 없으므로 답은 <b>${q.answerText}</b>예요.`;else steps+=`<b>2.</b> 두 수의 소수 자릿수는 모두 <b>${total}자리</b>예요.<br><b>3.</b> 곱 ${raw}에서 오른쪽부터 ${total}자리를 세어 소수점을 찍으면 <b>${q.answerText}</b>예요.`;return steps}function lockAnswers(){$('#answerInput').disabled=true;$('#checkBtn').disabled=true;$$('#mcqMode button').forEach(b=>b.disabled=true)}
function grade(value,clickedBtn=null){const q=state.questions[state.index],user=Number(value),ok=Math.abs(user-q.answer)<1e-9;lockAnswers();if(ok){state.score++;state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);$('#feedback').className='feedback good';$('#feedbackTitle').textContent='🎉 정답!';$('#feedbackText').textContent='정답! 소수점 위치까지 정확해요.';if(clickedBtn)clickedBtn.style.background='#dff7ec'}else{state.streak=0;state.wrong.push({...q,userAnswer:formatNum(user)});$('#feedback').className='feedback bad';$('#feedbackTitle').textContent='조금만 더 생각해 볼까요?';$('#feedbackText').innerHTML=`자연수처럼 계산한 뒤 소수 자릿수를 다시 확인해 보세요.<br><b>정답은 ${q.answerText}</b>입니다.`;if(clickedBtn)clickedBtn.style.background='#fff0f2'}$('#solution').innerHTML=makeSolution(q);$('#solutionBtn').classList.remove('hidden');$('#nextBtn').classList.remove('hidden');$('#score').textContent=state.score;$('#streak').textContent=state.streak}
$('#checkBtn').onclick=()=>{const v=normalizeNumberText($('#answerInput').value);if(v===null){alert('숫자로 답을 입력해 주세요. 예: 3.6');return}grade(v)};$('#answerInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#checkBtn').disabled)$('#checkBtn').click()});$('#solutionBtn').onclick=()=>$('#solution').classList.toggle('hidden');$('#nextBtn').onclick=()=>{state.index++;if(state.index>=state.questions.length)finish();else renderQuestion()};
function finish(){showScreen('result');const total=state.questions.length,correct=state.score,pct=Math.round(correct/total*100);$('#scoreBig').textContent=`${pct}점`;$('#correctStat').textContent=`${correct} / ${total}`;$('#bestStreakStat').textContent=state.bestStreak;$('#accuracyStat').textContent=`${pct}%`;const wrong=$('#wrongList');wrong.innerHTML='';$('#wrongSection').classList.toggle('hidden',state.wrong.length===0);$('#retryWrongBtn').classList.toggle('hidden',state.wrong.length===0);state.wrong.forEach(q=>{const div=document.createElement('div');div.className='wrong-item';div.innerHTML=`<span><b>${q.a} × ${q.b}</b></span><span>내 답: ${q.userAnswer} · 정답: <b>${q.answerText}</b></span>`;wrong.appendChild(div)})}
$('#retryWrongBtn').onclick=()=>{const m=radioValue('mode');const retryQs=state.wrong.map(q=>({...q,mode:m==='mix'?(Math.random()<.5?'input':'mcq'):m}));start(retryQs)};$('#restartBtn').onclick=()=>showScreen('setup');$('#startBtn').onclick=()=>start();$('#homeBtn').onclick=()=>{if(confirm('현재 연습을 끝내고 처음 화면으로 갈까요?'))showScreen('setup')};$('#boardBtn').onclick=()=>{document.body.classList.toggle('board');$('#boardBtn').textContent=document.body.classList.contains('board')?'↩️ 일반 화면':'🖥️ 전자칠판 모드'};
</script>
</body>
</html>
